# Tests on every push and pull request. SECURITY.md sections 3, 8 and 14.
# - Actions are pinned to exact commits, not tags.
# - The workflow can only read the repository.
# - The access tests need the TESTING project's settings, kept as secrets in the protected "testing" environment. They run only
#   on pushes to this repository, never on pull requests, so a pull request from someone else's copy never sees a secret.
#   Never put the real project's settings here.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm test
  access:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: testing
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Access tests against the testing project
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
        run: node --test tests/access.test.js
