<!doctype html>
<meta charset="utf-8">
<title>Jump Lab test</title>
<!-- A test only, not part of the app. It tracks the body in a clip frame by frame and can draw the skeleton over a frame.
     run.mjs opens this page in headless Chrome and calls window.track() and window.draw(). -->
<style>body { margin: 0; background: #111; } canvas { display: block; } video { display: none; }</style>
<video id="v" muted playsinline></video>
<canvas id="c"></canvas>
<script type="module">
  import { FilesetResolver, PoseLandmarker } from "./node_modules/@mediapipe/tasks-vision/vision_bundle.mjs";
  const v = document.getElementById("v"), c = document.getElementById("c"), g = c.getContext("2d");
  let FPS = 60;   // set for each clip by window.rate()
  let tracker = null, mode = "";

  async function init(runningMode, delegate) {
    if (tracker && mode === runningMode + delegate) return;
    const files = await FilesetResolver.forVisionTasks("./node_modules/@mediapipe/tasks-vision/wasm");
    tracker = await PoseLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: "./models/pose_landmarker_full.task", delegate },
      runningMode, numPoses: 1, minPoseDetectionConfidence: 0.3, minPosePresenceConfidence: 0.3, minTrackingConfidence: 0.3,
    });
    mode = runningMode + delegate;
  }

  const load = (url) => new Promise((res, rej) => {
    v.onloadeddata = () => res(); v.onerror = () => rej(new Error("cannot play " + url));
    v.src = url; v.load();
  });
  // show exactly the frame at time t
  const seek = (t) => new Promise((res) => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    // the frame is ready when the seek ends; wait one screen refresh so it is the one being shown
    v.onseeked = () => { requestAnimationFrame(fin); setTimeout(fin, 150); };
    v.currentTime = t;
  });
  const r4 = (n) => Math.round(n * 10000) / 10000;

  // The clip's real frame rate: play it for a moment and time the gaps between the frames the browser shows.
  window.rate = async (url) => {
    await load(url);
    const gap = await new Promise((res) => {
      const ts = [], cb = (now, m) => { ts.push(m.mediaTime); if (ts.length < 60 && !v.ended) v.requestVideoFrameCallback(cb); else fin(); };
      let done = false;
      const fin = () => { if (done) return; done = true; v.pause(); const d = []; for (let i = 1; i < ts.length; i++) if (ts[i] > ts[i - 1]) d.push(ts[i] - ts[i - 1]); d.sort((a, b) => a - b); res(d.length ? d[Math.floor(d.length / 2)] : 0); };
      v.currentTime = 0; v.requestVideoFrameCallback(cb); v.play(); setTimeout(fin, 5000);
    });
    FPS = gap ? Math.round((1 / gap) * 100) / 100 : 60;
    return FPS;
  };

  // Track frames [from, to) of a clip. Returns one entry per frame: null when no body was found, or the 33 body points
  // as [x, y, visibility] (x and y from 0 to 1 across the picture) and the same points in metres around the hips.
  // step: track every nth frame (a quick pass). delegate: "CPU", or "GPU" to use the graphics chip.
  window.track = async (url, { from = 0, to = Infinity, runningMode = "VIDEO", step = 1, delegate = "CPU" } = {}) => {
    await init(runningMode, delegate);
    await load(url);
    const total = Math.floor(v.duration * FPS), frames = [], t0 = performance.now();
    for (let i = Math.max(0, from); i < Math.min(total, to); i += step) {
      await seek((i + 0.5) / FPS);
      const r = runningMode === "VIDEO" ? tracker.detectForVideo(v, Math.round((i * 1000) / FPS)) : tracker.detect(v);
      const p = r.landmarks && r.landmarks[0], w = r.worldLandmarks && r.worldLandmarks[0];
      frames.push(p ? { i, p: p.map((k) => [r4(k.x), r4(k.y), r4(k.visibility ?? 0)]), w: w ? w.map((k) => [r4(k.x), r4(k.y), r4(k.z)]) : null } : { i, p: null });
    }
    window.DATA = { url, w: v.videoWidth, h: v.videoHeight, fps: FPS, total, step, delegate, frames, msPerFrame: Math.round((performance.now() - t0) / Math.max(1, frames.length)) };
    return window.DATA;
  };

  // Draw frame i of the tracked clip with its skeleton, at the given scale.
  window.draw = async (i, scale = 0.375, label = "") => {
    const d = window.DATA, f = d.frames.find((x) => x.i === i);
    await seek((i + 0.5) / FPS);
    c.width = Math.round(d.w * scale); c.height = Math.round(d.h * scale);
    g.drawImage(v, 0, 0, c.width, c.height);
    if (f && f.p) {
      g.lineWidth = 3; g.strokeStyle = "#7fd0ff";
      for (const { start, end } of PoseLandmarker.POSE_CONNECTIONS) {
        const a = f.p[start], b = f.p[end];
        if (a[2] < 0.3 || b[2] < 0.3) continue;
        g.beginPath(); g.moveTo(a[0] * c.width, a[1] * c.height); g.lineTo(b[0] * c.width, b[1] * c.height); g.stroke();
      }
      f.p.forEach((k, n) => { if (n > 10 && k[2] >= 0.3) { g.fillStyle = n % 2 ? "#ffd36b" : "#ffffff"; g.beginPath(); g.arc(k[0] * c.width, k[1] * c.height, 4, 0, 7); g.fill(); } });
    }
    g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(0, 0, c.width, 26); g.fillStyle = "#fff"; g.font = "15px system-ui";
    g.fillText(`frame ${i}  ${(i / FPS).toFixed(2)} s  ${f && f.p ? "" : "NO BODY FOUND"} ${label}`, 8, 18);
    return true;
  };
  // Draw a close-up of frame i: a square around the body, with its skeleton, for checking a find by eye.
  window.drawCrop = async (i, size = 300, label = "") => {
    const d = window.DATA, f = d.frames.find((x) => x.i === i);
    await seek((i + 0.5) / FPS);
    c.width = size; c.height = size;
    let cx = 0.5, cy = 0.5;
    if (f && f.p) { cx = (f.p[23][0] + f.p[24][0]) / 2; cy = (f.p[23][1] + f.p[24][1]) / 2; }
    const src = 0.3 * d.h, sx = cx * d.w - src / 2, sy = cy * d.h - src / 2, k = size / src;
    g.fillStyle = "#111"; g.fillRect(0, 0, size, size);
    g.drawImage(v, sx, sy, src, src, 0, 0, size, size);
    if (f && f.p) {
      const X = (p) => (p[0] * d.w - sx) * k, Y = (p) => (p[1] * d.h - sy) * k;
      g.lineWidth = 2.5; g.strokeStyle = "#7fd0ff";
      for (const { start, end } of PoseLandmarker.POSE_CONNECTIONS) { const a = f.p[start], b = f.p[end]; if (start < 11 || end < 11) continue; g.beginPath(); g.moveTo(X(a), Y(a)); g.lineTo(X(b), Y(b)); g.stroke(); }
      f.p.forEach((p, n) => { if (n > 10) { g.fillStyle = n % 2 ? "#ffd36b" : "#ffffff"; g.beginPath(); g.arc(X(p), Y(p), 3, 0, 7); g.fill(); } });
    }
    g.fillStyle = "rgba(0,0,0,.65)"; g.fillRect(0, 0, size, 22); g.fillStyle = "#fff"; g.font = "13px system-ui";
    g.fillText(`${Math.floor(i / FPS / 60)}:${((i / FPS) % 60).toFixed(1).padStart(4, "0")}  frame ${i} ${label}`, 6, 16);
    return true;
  };
  window.READY = true;
</script>
